:root{
  --yellow:#ffe89a;
  --pink:#ffe3f2;
  --mint:#ccefd9;
  --green:#2dbe64;
  --green-dark:#179c49;
  --berry:#d7144b;
  --ink:#333333;
  --ink-soft:#6f6c65;
  --ink-faint:#a09c94;
  --line:#e7e3da;
  --bg:#ffffff;
  --cream:#fdf7ef;
  --r:24px;
  --shadow:0 18px 44px -28px rgba(51,51,51,.4);
  --ease:cubic-bezier(.22,.75,.18,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Euclid',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,figure{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
::selection{background:var(--yellow)}

/* ---------- шапка ---------- */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}
.hdr__in{max-width:860px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo__vv{display:block;height:18px;width:auto;flex:none}
.logo__div{width:1px;height:22px;background:var(--line);flex:none}
.logo__name{font-family:'Villula',Georgia,serif;font-size:16px;line-height:1;color:var(--ink);letter-spacing:.005em;white-space:nowrap}
@media (max-width:430px){
  .logo{gap:9px}
  .logo__vv{height:15px}
  .logo__div{height:18px}
  .logo__name{font-size:13.5px}
}
.hdr__meta{font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
@media (max-width:520px){.hdr__meta{font-size:11.5px}}

/* ---------- жёлтый блок ---------- */
.hero{
  position:relative;background:var(--yellow);overflow:hidden;
  transition:max-height .5s var(--ease),opacity .35s var(--ease),padding .5s var(--ease);
  max-height:760px;
}
.hero.is-hidden{max-height:0;opacity:0}
.hero__in{max-width:860px;margin:0 auto;padding:clamp(26px,5vw,52px) 20px 0;text-align:center;position:relative;z-index:2}
.pill{
  display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:999px;
  padding:8px 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6b5a12;
}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.hero__h{
  font-family:'Villula',Georgia,serif;font-weight:400;line-height:.98;letter-spacing:-.01em;
  font-size:clamp(30px,6.4vw,54px);margin-top:16px;
}
.hero__lead{margin:14px auto 0;max-width:44ch;font-size:clamp(14.5px,1.6vw,17px);color:#5f5320;line-height:1.5}
.hero__art{max-width:860px;margin:clamp(10px,2vw,18px) auto 0;padding:0 12px;position:relative;z-index:1}
.hero__art svg{width:100%;height:auto;display:block}
@media (max-width:640px){.hero__art{padding:0 4px}.hero__art svg{width:112%;margin-left:-6%}}

/* ---------- карточка ---------- */
.main{max-width:860px;margin:0 auto;padding:0 20px 40px}
.card{
  position:relative;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
  padding:clamp(20px,4vw,40px);margin-top:-28px;z-index:3;
}
.card--flat{margin-top:24px;box-shadow:none;border:1px solid var(--line)}

.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background-color .4s var(--ease)}
.steps i.is-on{background:var(--green)}

.kicker{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-dark)}
.h2{font-family:'Villula',Georgia,serif;font-weight:400;font-size:clamp(24px,4.4vw,34px);line-height:1.02;margin-top:8px;letter-spacing:-.01em}
.lead{margin-top:10px;color:var(--ink-soft);font-size:14.5px;line-height:1.5;max-width:52ch}

.fields{display:flex;flex-direction:column;gap:20px;margin-top:22px}
.f{display:flex;flex-direction:column;gap:7px}
.f__label{font-size:14.5px;line-height:1.35}
.f__label b{color:var(--berry);font-weight:400;margin-left:1px}
.f__hint{font-size:12.5px;color:var(--ink-faint);line-height:1.45}
.f__hint a{color:var(--green-dark);border-bottom:1px solid rgba(23,156,73,.3);text-decoration:none}
.f__hint a:hover{border-bottom-color:currentColor}

.inp,.ta,.sel{
  width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;
  padding:13px 15px;font:inherit;font-size:15px;color:var(--ink);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.ta{min-height:96px;resize:vertical;line-height:1.5}
.inp::placeholder,.ta::placeholder{color:#bdb9b1}
.inp:focus,.ta:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(45,190,100,.14)}
.f.is-error .inp,.f.is-error .ta,.f.is-error .chips{border-color:var(--berry)}
.f.is-error .inp,.f.is-error .ta{background:#fff8f9}
.f__err{font-size:12px;color:var(--berry);display:none}
.f.is-error .f__err{display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;background:#fff;
  transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease);
}
.chip:hover{border-color:var(--green);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip[aria-pressed="true"]:hover{background:var(--green-dark);border-color:var(--green-dark)}

.drop{
  border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;background:#fcfbf8;
  transition:border-color .2s var(--ease),background-color .2s var(--ease);cursor:pointer;display:block;
}
.drop:hover,.drop.is-over{border-color:var(--green);background:#f4fdf6}
.drop b{display:block;font-weight:400;font-size:14px;margin-top:6px}
.drop small{display:block;color:var(--ink-faint);font-size:12px;margin-top:3px}
.drop svg{width:26px;height:26px;margin:0 auto;color:var(--green)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:62px;height:62px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(51,51,51,.8);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center}

.subfield{display:none;margin-top:16px}
.subfield.is-on{display:block;animation:subIn .26s var(--ease)}
@keyframes subIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.consent{display:flex;align-items:flex-start;gap:11px;cursor:pointer;font-size:14.5px;line-height:1.4;padding-top:2px}
.consent input{
  appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;margin:0;
  transition:background-color .18s var(--ease),border-color .18s var(--ease);position:relative;cursor:pointer;
}
.consent input:checked{background:var(--green);border-color:var(--green)}
.consent .req{color:var(--berry);font-weight:400}
.f.is-error .consent input{border-color:var(--berry);background:#fff8f9}
.f.is-error .consent span{color:var(--berry)}
.consent input:checked::after{
  content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:2px solid #fff;border-top:0;border-left:0;
  transform:rotate(42deg);
}
.counter{font-size:11.5px;color:var(--ink-faint);text-align:right;margin-top:2px}

/* ---------- «рассказать подробнее» ---------- */
.more{margin-top:22px;scroll-margin-top:84px;border:1.5px dashed var(--line);border-radius:18px;background:#fcfbf8;overflow:hidden}
.more summary{
  cursor:pointer;padding:15px 18px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  list-style:none;
}
.more summary::-webkit-details-marker{display:none}
.more summary b{font-weight:400;color:var(--green-dark)}
.more[open] summary{border-bottom:1px dashed var(--line)}
.more__body{padding:18px;display:flex;flex-direction:column;gap:18px}

/* ---------- кнопки и навигация ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap-reverse}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 26px;border-radius:999px;
  font-size:15px;transition:transform .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
}
.btn--green{background:var(--green);color:#fff}
.btn--green:hover{background:var(--green-dark);transform:translateY(-2px)}
.btn--ghost{border:1.5px solid var(--line);color:var(--ink);height:48px;padding:0 20px;font-size:14px}
.btn--ghost:hover{border-color:var(--ink)}
.btn--white{background:#fff;color:var(--ink);border:1.5px solid #fff}
.btn--white:hover{transform:translateY(-2px)}
.btn__a{transition:transform .2s var(--ease)}
.btn:hover .btn__a{transform:translateX(3px)}
.nav__hint{font-size:12.5px;color:var(--ink-faint)}

/* ---------- финал ---------- */
.done{text-align:center;padding:8px 0 4px}
.done__art{width:150px;margin:0 auto 6px}
.done__h{font-family:'Villula',Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,38px);line-height:1;margin-top:6px}
.done__note{margin:14px auto 0;max-width:52ch;font-size:13px;line-height:1.45;padding:11px 15px;border-radius:14px}
.done__note a{border-bottom:1px solid currentColor;text-decoration:none}
.done__note.is-ok{background:#eafaf0;color:#179c49}
.done__note.is-warn{background:#fff5e6;color:#8a5a12}
.done__p{margin:12px auto 0;max-width:46ch;color:var(--ink-soft);font-size:14.5px}
.brief{margin-top:22px;text-align:left;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:#fcfbf8}
.brief__head{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
.brief pre{margin:0;padding:16px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:min(46vh,380px);overflow:auto;overscroll-behavior:contain}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);max-width:90vw;text-align:center;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

.foot{max-width:860px;margin:0 auto;padding:6px 20px 40px;font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:1px;text-decoration:none}
.foot a:hover{border-bottom-color:var(--green)}

.hide{display:none!important}
.hp{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

        { k: 'allergens', type: 'chips', label: 'Что из этого есть в составе',
          options: ['молоко', 'глютен', 'яйцо', 'орехи', 'арахис', 'соя', 'рыба', 'морепродукты', 'кунжут', 'горчица', 'сельдерей'] }

    },
    {

        { k: 'credit', type: 'chips', label: 'Как указать вас, если продукт выйдет', single: true,

        { k: 'consent', type: 'consent', label: 'Согласен на обработку персональных данных', required: true,

      ],
      extra: [
        { k: 'altNames', type: 'text', label: 'Ещё варианты названия', hint: 'Если придумали несколько — перечислите через запятую.' },
        { k: 'texture', type: 'chips', label: 'Консистенция', single: true,
          options: ['рассыпчатая', 'плотная', 'кремовая', 'хрустящая', 'жидкая', 'вязкая'] },
        { k: 'storage', type: 'chips', label: 'Как хранить', single: true,
          options: ['в холодильнике', 'в морозилке', 'при комнатной температуре'] },
        { k: 'shelfLife', type: 'text', label: 'Сколько хранится после приготовления', placeholder: '2 дня' },
        { k: 'extras', type: 'chips', label: 'Что положить в комплект', options: ['соус отдельно', 'приборы', 'салфетки'] },
        { k: 'season', type: 'chips', label: 'Сезонность', single: true, options: ['круглый год', 'сезонно', 'зависит от ингредиентов'] },
        { k: 'region', type: 'text', label: 'Откуда рецепт', placeholder: 'Казань, бабушкин рецепт' }
      ]
    }
  ];

  var ALL_FIELDS = STEPS.reduce(function (a, s) { return a.concat(s.fields, s.extra || []); }, []);

  /* ---------- хранилище ---------- */
  try {
    var saved = window.localStorage.getItem(KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && parsed.values) { state.values = parsed.values; state.step = parsed.step || 0; }
    }
    window.localStorage.setItem(KEY + '-probe', '1');
    window.localStorage.removeItem(KEY + '-probe');
  } catch (e) { canStore = false; }

  function persist() {
    if (!canStore) return;
    try { window.localStorage.setItem(KEY, JSON.stringify({ values: state.values, step: state.step })); }
    catch (e) { canStore = false; }
  }

  /* ---------- утилиты ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function get(k) { return state.values[k]; }
  function set(k, v) { state.values[k] = v; persist(); }
  function isEmpty(v) {
    if (v === undefined || v === null) return true;
    if (Array.isArray(v)) return v.length === 0;
    if (typeof v === 'boolean') return !v;
    return String(v).trim() === '';
  }

  /* ============================================================
     Рендер поля
     ============================================================ */
  function fieldHtml(f) {
    var v = get(f.k);
    var req = f.required ? '<b>*</b>' : '';
    var label = f.type === 'consent' ? '' : '<div class="f__label">' + esc(f.label) + req + '</div>';
    var hint = f.hint ? '<div class="f__hint">' + esc(f.hint) + '</div>' : '';
    var body = '';

    if (f.type === 'text') {
      body = '<input class="inp" id="f-' + f.k + '" type="text" value="' + esc(v || '') + '" placeholder="' + esc(f.placeholder || '') + '"' +
        (f.maxlength ? ' maxlength="' + f.maxlength + '" data-max="' + f.k + '"' : '') + '>' +
        (f.maxlength ? '<div class="counter"><span id="c-' + f.k + '">' + (v ? String(v).length : 0) + '</span>/' + f.maxlength + '</div>' : '');
    } else if (f.type === 'textarea') {
      body = '<textarea class="ta" id="f-' + f.k + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v || '') + '</textarea>';
    } else if (f.type === 'chips') {
      var arr = f.single ? [v] : (Array.isArray(v) ? v : []);
      body = '<div class="chips">' + f.options.map(function (o) {
        var on = arr.indexOf(o) >= 0;
        return '<button type="button" class="chip" aria-pressed="' + on + '" data-chip="' + f.k + '" data-val="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('') + '</div>';
      if (f.other) {
        var o = f.other, ov = get(o.k), onOther = v === 'другое';
        body += '<div class="subfield' + (onOther ? ' is-on' : '') + '" id="wrap-' + o.k + '">' +
          '<div class="f" data-field="' + o.k + '">' +
          '<div class="f__label">' + esc(o.label) + '<b>*</b></div>' +
          '<input class="inp" id="f-' + o.k + '" type="text" value="' + esc(ov || '') + '" placeholder="' + esc(o.placeholder || '') + '">' +
          (o.hint ? '<div class="f__hint">' + esc(o.hint) + '</div>' : '') +
          '<div class="f__err">Напишите свой вариант — без этого непонятно, что за продукт</div>' +
          '</div></div>';
      }
    } else if (f.type === 'photo') {
      body = '<label class="drop" id="drop">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-4 4 3 3-3 4 4"/></svg>' +
        '<b>Добавить фото</b><small>можно несколько</small>' +
        '<input type="file" accept="image/*" multiple class="hide" id="photoInput"></label>' +
        '<div class="thumbs" id="thumbs"></div>';
    } else if (f.type === 'consent') {
      body = '<label class="consent"><input type="checkbox" id="f-' + f.k + '"' + (v ? ' checked' : '') + ' aria-required="true">' +
        '<span>' + esc(f.label) + ' <b class="req" aria-hidden="true">*</b></span></label>' +
        '<div class="f__hint">Обязательное поле — без согласия не сможем вернуться к вам с вопросами. ' +
        'Подробнее в <a href="https://vkusvill.ru/legal/privacy" target="_blank" rel="noopener">политике конфиденциальности</a>.</div>';
    }

    return '<div class="f" data-field="' + f.k + '">' + label + body + hint +
      '<div class="f__err">' + esc(f.err || 'Заполните это поле') + '</div></div>';
  }

  /* ============================================================
     Рендер шага
     ============================================================ */
  function render() {
    if (state.done) { renderDone(); return; }

    var s = STEPS[state.step];
    hero.classList.toggle('is-hidden', state.step > 0);

    var dots = '<div class="steps">' + STEPS.map(function (_, i) {
      return '<i class="' + (i <= state.step ? 'is-on' : '') + '"></i>';
    }).join('') + '</div>';

    var more = (s.extra && s.extra.length)
      ? '<details class="more"><summary><span>Есть 2 минуты? Расскажите подробнее</span><b>необязательно +</b></summary>' +
        '<div class="more__body">' + s.extra.map(fieldHtml).join('') + '</div></details>'
      : '';

    panel.className = 'card' + (state.step === 0 ? '' : ' card--flat');
    panel.innerHTML = dots +
      '<p class="kicker">' + esc(s.kicker) + '</p>' +
      '<h2 class="h2">' + esc(s.title) + '</h2>' +
      '<p class="lead">' + esc(s.lead) + '</p>' +
      '<div class="fields">' + s.fields.map(fieldHtml).join('') + '</div>' +
      more +
      '<div class="nav">' +
      (state.step > 0 ? '<button class="btn btn--ghost" type="button" id="prev">← Назад</button>' : '<span class="nav__hint">' + (canStore ? 'Черновик сохранится сам' : '') + '</span>') +
      '<button class="btn btn--green" type="button" id="next">' +
      (state.step === STEPS.length - 1 ? 'Отправить' : 'Дальше') + ' <span class="btn__a">→</span></button>' +
      '</div>';

    $('#hdrMeta').textContent = 'Шаг ' + (state.step + 1) + ' из ' + STEPS.length;

    bind(s);
    $('#next').addEventListener('click', onNext);
    var prev = $('#prev');
    if (prev) prev.addEventListener('click', function () { state.step = Math.max(0, state.step - 1); persist(); render(); scrollTop(); });
  }

  function bind(step) {
    var all = step.fields.concat(step.extra || []);
    all.forEach(function (f) {
      var el = document.getElementById('f-' + f.k);
      if (!el && f.type !== 'photo') return;
      if (f.type === 'text' || f.type === 'textarea') {
        el.addEventListener('input', function () {
          set(f.k, el.value);
          clearError(f.k);
          if (f.maxlength) { var c = $('#c-' + f.k); if (c) c.textContent = el.value.length; }
        });
      }
      if (f.type === 'photo') {
        var input = $('#photoInput'), drop = $('#drop');
        if (input) input.addEventListener('change', function () {
          var files = Array.prototype.slice.call(input.files);
          files.reduce(function (chain, file) {
            return chain.then(function () {
              return shrink(file).then(function (src) {
                if (src) { state.photos.push({ name: file.name, src: src }); renderThumbs(); }
              });
            });
          }, Promise.resolve()).then(function () {
            input.value = '';
            if (files.length) toast('Фото прикреплены');
          });
        });
        if (drop) ['dragover', 'dragleave', 'drop'].forEach(function (ev) {
          drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.toggle('is-over', ev === 'dragover'); });
        });
        renderThumbs();
      }
    });

    $$('[data-chip]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var k = chip.getAttribute('data-chip'), val = chip.getAttribute('data-val');
        var f = all.filter(function (x) { return x.k === k; })[0] || {};
        if (f.single) {
          set(k, get(k) === val ? '' : val);
          $$('[data-chip="' + k + '"]').forEach(function (c) {
            c.setAttribute('aria-pressed', String(c.getAttribute('data-val') === get(k)));
          });
        } else {
          var arr = Array.isArray(get(k)) ? get(k).slice() : [];
          var i = arr.indexOf(val);
          if (i >= 0) arr.splice(i, 1); else arr.push(val);
          set(k, arr);
          chip.setAttribute('aria-pressed', String(arr.indexOf(val) >= 0));
        }
        clearError(k);
        if (f.other) {
          var wrap = document.getElementById('wrap-' + f.other.k);
          var on = get(k) === 'другое';
          if (wrap) wrap.classList.toggle('is-on', on);
          if (on) setTimeout(function () {
            var inp = document.getElementById('f-' + f.other.k);
            if (inp && !inp.value) inp.focus();
          }, 140);
        }
      });
    });

    step.fields.forEach(function (f) {
      if (!f.other) return;
      var oinp = document.getElementById('f-' + f.other.k);
      if (oinp) oinp.addEventListener('input', function () {
        set(f.other.k, oinp.value);
        clearError(f.other.k);
      });
    });

    var consent = panel.querySelector('.consent input');
    if (consent) consent.addEventListener('change', function () {
      set(consent.id.replace('f-', ''), consent.checked);
      clearError(consent.id.replace('f-', ''));
    });
  }

  function renderThumbs() {
    var box = $('#thumbs');
    if (!box) return;
    box.innerHTML = state.photos.map(function (p, i) {
      return '<div class="thumb"><img src="' + p.src + '" alt="' + esc(p.name) + '"><button type="button" data-del="' + i + '" aria-label="Удалить">×</button></div>';
    }).join('');
    $$('[data-del]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        state.photos.splice(parseInt(b.getAttribute('data-del'), 10), 1);
        renderThumbs();
      });
    });
  }

  /* ---------- валидация ---------- */
  function clearError(k) {
    var f = panel.querySelector('[data-field="' + k + '"]');
    if (f) f.classList.remove('is-error');
  }
  function validate(step) {
    var bad = [];
    step.fields.forEach(function (f) {
      if (f.required && isEmpty(get(f.k))) bad.push(f.k);
      if (f.other && get(f.k) === 'другое' && isEmpty(get(f.other.k))) bad.push(f.other.k);
    });
    bad.forEach(function (k) {
      var el = panel.querySelector('[data-field="' + k + '"]');
      if (el) el.classList.add('is-error');
    });
    if (bad.length) {
      var first = panel.querySelector('.f.is-error');
      if (first) first.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    }
    return bad.length === 0;
  }

  function onNext() {
    if (!validate(STEPS[state.step])) return;
    if (state.step === STEPS.length - 1) { submit(); return; }
    state.step += 1; persist(); render(); scrollTop();
  }

  function scrollTop() {
    var y = panel.getBoundingClientRect().top + window.pageYOffset - 72;
    window.scrollTo({ top: Math.max(0, y), behavior: reduce ? 'auto' : 'smooth' });
  }

  /* ============================================================
     Отправка: фото, payload, транспорт
     ============================================================ */
  function shrink(file) {
    return new Promise(function (resolve) {
      if (!/^image\//.test(file.type)) { resolve(null); return; }
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        if (Math.max(w, h) > max) { var k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        try { resolve(c.toDataURL('image/jpeg', 0.82)); } catch (e) { resolve(null); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function dataURLtoBlob(d) {
    var parts = d.split(','), mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
    var bin = atob(parts[1]), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }

  function buildPayload() {
    var answers = {};
    ALL_FIELDS.forEach(function (f) {
      if (f.type === 'photo' || f.type === 'consent') return;
      var v = get(f.k);
      if (isEmpty(v)) return;
      answers[f.label] = Array.isArray(v) ? v.join(', ') : v;
    });
    return {
      source: 'Создатели вкуса · дозаполнить анкету',
      product: get('title') || '', name: get('name') || '', contact: get('contact') || '',
      category: get('category') || '', categoryOther: get('categoryOther') || '',
      answers: answers, brief: buildBrief(), secret: SEND.secret,
      photoCount: state.photos.length,
      page: window.location.href,
      submittedAt: new Date().toISOString()
    };
  }

  function sendWebhook(p) {
    if (SEND.withPhotos && state.photos.length) {
      p.photos = state.photos.map(function (ph) {
        return { name: ph.name || 'photo.jpg', data: ph.src };
      });
    }
    // text/plain — чтобы браузер не делал preflight-запрос к Google Apps Script
    return fetch(SEND.webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(p)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      // если ответ читается — проверяем {"ok":true}; если CORS не даёт прочитать, считаем отправленным
      return r.text().then(function (t) {
        var json = null;
        try { json = JSON.parse(t); } catch (e) { return; }
        if (json && json.ok === false) throw new Error('rejected: ' + (json.error || ''));
      }, function () {});
    });
  }

  function sendTelegram(p) {
    var base = 'https://api.telegram.org/bot' + SEND.telegram.token + '/';
    var text = p.brief + (state.photos.length ? '\n\nФото: ' + state.photos.length + ' шт. — ниже' : '');
    var fd = new FormData();
    fd.append('chat_id', SEND.telegram.chatId);
    fd.append('text', text);
    fd.append('disable_web_page_preview', 'true');
    return fetch(base + 'sendMessage', { method: 'POST', body: fd }).then(function (r) {
      if (!r.ok) throw new Error('sendMessage ' + r.status);
      if (!SEND.withPhotos) return;
      return state.photos.reduce(function (chain, ph) {
        return chain.then(function () {
          var f = new FormData();
          f.append('chat_id', SEND.telegram.chatId);
          f.append('photo', dataURLtoBlob(ph.src), ph.name || 'photo.jpg');
          return fetch(base + 'sendPhoto', { method: 'POST', body: f });
        });
      }, Promise.resolve());
    });
  }

  function sendAll() {
    if (SEND.mode === 'none') return Promise.resolve('local');
    var ready = SEND.mode === 'telegram'
      ? !!(SEND.telegram.token && SEND.telegram.chatId)
      : !!SEND.webhook;
    if (!ready) return Promise.resolve('local');
    var p = buildPayload();
    var job = SEND.mode === 'telegram' ? sendTelegram(p) : sendWebhook(p);
    return job.then(function () { return 'sent'; }, function (err) {
      try { console.warn('Не удалось отправить заявку:', err); } catch (e) {}
      return 'error';
    });
  }

  /* ============================================================
     Бриф и отправка
     ============================================================ */
  function valueText(f) {
    var v = get(f.k);
    if (f.type === 'consent') return v ? 'да' : '—';
    if (Array.isArray(v)) return v.join(', ');
    return isEmpty(v) ? '—' : String(v);
  }

  function buildBrief() {
    var out = [];
    out.push('ЗАЯВКА НА ПРОДУКТ · Создатели вкуса · ВкусВилл');
    out.push('Продукт: ' + (get('title') || '—'));
    out.push('Автор: ' + (get('name') || '—') + (get('contact') ? ' · ' + get('contact') : ''));
    out.push('Категория: ' + (get('category') === 'другое' && get('categoryOther')
      ? 'другое — ' + get('categoryOther')
      : (get('category') || '—')));
    out.push('');
    STEPS.forEach(function (s) {
      var skip = ['name', 'contact', 'category'];
      var rows = s.fields.concat(s.extra || []).filter(function (f) {
        if (f.type === 'photo' || f.type === 'consent' || skip.indexOf(f.k) >= 0) return false;
        return !isEmpty(get(f.k));
      }).map(function (f) { return '  · ' + f.label + ': ' + valueText(f); });
      if (rows.length) { out.push('— ' + s.name.toUpperCase()); out.push(rows.join('\n')); out.push(''); }
    });
    if (state.photos.length) out.push('Фото: ' + state.photos.length + ' шт. — приложите к заявке');
    out.push('Заполнено: ' + new Date().toLocaleString('ru-RU'));
    return out.join('\n');
  }

  function renderDone() {
    var text = buildBrief();
    var status = state.status || 'local';
    var note = status === 'sent'
      ? '<div class="done__note is-ok">Заявка отправлена команде разработки, фото приложены.</div>'
      : status === 'error'
        ? '<div class="done__note is-warn">Не получилось отправить автоматически. Сохраните заявку и пришлите её в <a href="https://t.me/creators_in_taste" target="_blank" rel="noopener">чат создателей вкуса</a>.</div>'
        : '<div class="done__note is-warn">Черновик сохранён у вас. Скопируйте или скачайте заявку и пришлите её в <a href="https://t.me/creators_in_taste" target="_blank" rel="noopener">чат создателей вкуса</a>.</div>';
    hero.classList.add('is-hidden');
    var meta = document.getElementById('hdrMeta');
    if (meta) meta.textContent = 'Готово';
    panel.className = 'card card--flat';
    panel.innerHTML =
      '<div class="done">' +
      '<div class="done__art">' + document.getElementById('doneArt').innerHTML + '</div>' +
      '<h2 class="done__h">Спасибо, ' + esc(get('name') || 'друг') + '</h2>' +
      '<p class="done__p">Заявка у команды разработки. Дальше — проверка технологии, названия и упаковки: коллеги вернутся с уточнениями. Обычно от анкеты до полки — не меньше трёх месяцев.</p>' +
      note +
      '<div class="brief"><div class="brief__head"><span>Что вы рассказали</span><span>сохраните себе</span></div><pre>' + esc(text) + '</pre></div>' +
      '<div class="actions">' +
      '<button class="btn btn--green" type="button" id="copy">Скопировать</button>' +
      '<button class="btn btn--ghost" type="button" id="download">Скачать .md</button>' +
      '</div></div>';

    $('#copy').addEventListener('click', function () { copy(text); });
    $('#download').addEventListener('click', function () { download(text); });
    scrollTop();
  }

  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('is-on');
    window.clearTimeout(toast._t);
    toast._t = window.setTimeout(function () { t.classList.remove('is-on'); }, 2600);
  }
  function copy(text) {
    var done = function () { toast('Скопировано — можно вставить в сообщение'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text) ? done() : toast('Не получилось — выделите текст вручную'); });
    } else if (fallback(text)) done(); else toast('Не получилось — выделите текст вручную');
  }
  function fallback(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function download(text) {
    try {
      var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zayavka-' + (get('title') || 'produkt').replace(/\s+/g, '-').toLowerCase() + '.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('Файл сохранён');
    } catch (e) { toast('Скачивание недоступно — скопируйте текст'); }
  }
  function submit() {
    if (!validate(STEPS[STEPS.length - 1])) return;
    var hp = document.getElementById('hp');
    if (hp && hp.value) {           // скрытое поле заполняют только боты
      state.status = 'local';
      state.done = true;
      render();
      return;
    }
    var btn = document.getElementById('next');
    if (btn) { btn.disabled = true; btn.textContent = 'Отправляем…'; }
    sendAll().then(function (status) {
      state.status = status;
      state.done = true;
      if (canStore) { try { window.localStorage.removeItem(KEY); } catch (e) {} }
      render();
    });
  }

  /* ---------- демо и dev-хуки ---------- */
  if (/demo/.test(window.location.hash) && !get('title')) {
    state.values = {
      name: 'Кумушай', contact: '@kumushai',
      title: 'Салат с карамелизированным персиком', category: 'салат',
      about: 'Яркий салат: сверху половинки персика, кубики брынзы, много зелени. Хорош на обед и как перекус.',
      ingredients: 'Персик, шпинат, руккола, романо, фета, брынза, черри, базилик, бальзамический уксус, масло оливковое, соль, перец',
      steps: '1. Персик нарезать и обжарить с сиропом 2 минуты\n2. Зелень промыть и обсушить\n3. Смешать, заправить, сверху брынза',
      phrase: 'С персиком, запечённым в сиропе', weight: '150 г', pack: 'ГМС-лоток',
      diff: 'Персик именно карамелизированный — в готовых салатах так не делают. Соус отдельно.',
      credit: 'имя и город', consent: true,
      proportions: 'На 2 порции: 2 персика, по горсти зелени, 60 г брынзы, 8 черри',
      keypoint: 'обжаривать 2 минуты на сильном огне', replace: 'только второстепенное',
      texture: 'хрустящая', storage: 'в холодильнике', shelfLife: '2 дня', season: 'сезонно',
      region: 'Казань, бабушкин рецепт', allergens: ['молоко']
    };
  }
  var m = window.location.hash.match(/step=(\d+)/);
  if (m) state.step = Math.min(parseInt(m[1], 10), STEPS.length - 1);

  render();
})();

</script>
